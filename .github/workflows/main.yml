name: Deploy React Site

on:
  push:
    branches:
      - react-site   # se ejecuta solo cuando hagas push a react-site
  schedule:
    - cron: "0 8 * * *"  # opcional: diario a las 8 AM UTC (3 AM Perú)

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Obtener el repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 4️⃣ Generar voces.json
      - name: Generate voces.json
        run: node scripts/generate-voces.js

      # 5️⃣ Construir el proyecto
      - name: Build project
        run: npm run build

      # 6️⃣ Deploy a GitHub Pages
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
