name: Daily Voces Update

on:
  schedule:
    - cron: "00 8 * * *"  # 2:10 AM Perú (UTC-5)
  workflow_dispatch:       # para poder ejecutarlo manualmente

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate voces.json
        run: node scripts/generate-voces.js

      - name: Build project
        run: npm run build

      - name: Create CNAME
        run: echo "www.wffperuchapter.page" > ./dist/CNAME

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
