name: Deploy React Site

on:
  workflow_dispatch:      # permite ejecutar manualmente desde GitHub
  schedule:
    - cron: "50 7 * * *"  # Diario a las 2:50 AM Perú (UTC-5)

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Obtener el repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 4️⃣ Generar voces.json
      - name: Generate voces.json
        run: node scripts/generate-voces.js

      # 5️⃣ Construir el proyecto
      - name: Build project
        run: npm run build

      # 6️⃣ Crear CNAME
      - name: Create CNAME file
        run: echo "www.wffperuchapter.page" > dist/CNAME

      # 7️⃣ Deploy a GitHub Pages
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
